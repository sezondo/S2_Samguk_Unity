<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S2 맵 메이커</title>
<style>
:root{--bg:#081017;--panel:#101b24;--panel2:#15232e;--line:#2c414f;--text:#ecf7f8;--muted:#8ea7b5;--cyan:#18d7e8;--red:#f45b5b;--green:#5ed08a;--gold:#e7b567}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(24,215,232,.09),transparent 35%),var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}button,input{font:inherit}button{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);cursor:pointer}button:hover:not(:disabled){border-color:var(--cyan)}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button:disabled,input:disabled{opacity:.38;cursor:not-allowed}
main{min-height:100vh;padding:20px}.top{max-width:1580px;margin:0 auto 18px;display:flex;align-items:end;justify-content:space-between;gap:16px}.eyebrow{margin:0 0 4px;color:var(--cyan);font-size:12px;letter-spacing:.12em}h1{margin:0;font-size:clamp(24px,3vw,38px)}.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:7px}.actions button{padding:9px 12px}.size-control{height:39px;padding:5px 8px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:12px}.size-control input{width:58px;padding:4px 5px;border:1px solid var(--line);border-radius:5px;background:#09131a;color:var(--text);text-align:center}
.workspace{max-width:1580px;margin:auto;display:grid;grid-template-columns:220px minmax(420px,900px) 275px;justify-content:center;align-items:start;gap:16px}.panel{border:1px solid var(--line);border-radius:12px;background:rgba(16,27,36,.94);padding:14px}.group+.group{margin-top:18px}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.group h2,.analysis h2{margin:0;color:var(--muted);font-size:13px}.tool-list{display:grid;gap:6px}.tool{min-height:39px;padding:6px 9px;display:flex;align-items:center;gap:9px;text-align:left}.tool.active,.route-button.active{border-color:var(--cyan);background:#103c47;color:var(--cyan)}.mark{width:25px;height:25px;display:grid;place-items:center;border-radius:5px;background:#26343e;font-weight:800}.object-tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.object-tool{aspect-ratio:1;display:grid;place-items:center;padding:0;font-size:20px}.object-tool.active{border-color:var(--cyan);background:#103c47;color:var(--cyan)}.red{color:var(--red)}.object-editor{margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#0b151d}.editor-title{margin:0 0 8px;color:var(--muted);font-size:11px}.field{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:11px}.field input{min-width:0;width:100%;padding:6px;border:1px solid var(--line);border-radius:5px;background:#09131a;color:var(--text)}.field input[type=color]{height:31px;padding:2px;cursor:pointer}
.route-list{display:grid;gap:6px}.route-button{min-height:37px;padding:6px 9px;display:flex;align-items:center;gap:8px;text-align:left}.route-dot{width:11px;height:11px;flex:none;border-radius:50%}.add-route{width:28px;height:28px;padding:0;border-color:#3a5d6c;color:var(--cyan);font-size:20px;line-height:1}.hint{margin:7px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.map-stage{min-width:0}.map-head{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--muted);font-size:13px}.map-head strong{color:var(--text)}.dot{width:8px;height:8px;display:inline-block;margin-right:5px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.canvas-wrap{width:100%;max-height:78vh;overflow:auto;display:grid;place-items:center;border:1px solid var(--line);background:#0b151c}canvas{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;background:#14202a;cursor:crosshair;touch-action:none}.help{margin:7px 0 0;color:var(--muted);font-size:12px;text-align:center}
.analysis{display:grid;gap:12px}.summary{border-bottom:1px solid var(--line);padding-bottom:12px}.summary h2{margin-bottom:7px;color:var(--text);font-size:17px}.summary p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.route-metrics{display:grid;gap:8px}.route-card{border:1px solid var(--line);border-radius:9px;padding:10px}.route-card-title{display:flex;align-items:center;gap:8px}.route-card-title span{width:10px;height:10px;border-radius:50%}.route-card h3{margin:0;font-size:14px}.route-card dl{margin:9px 0 0;display:grid;grid-template-columns:1fr auto;gap:5px;font-size:12px}.route-card dt{color:var(--muted)}.route-card dd{margin:0;font-weight:700}.count{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.count strong{color:var(--text)}.files{display:grid;grid-template-columns:1fr 1fr;gap:7px}.files button{min-height:38px;padding:6px;font-size:12px}.danger{color:var(--red)}footer{max-width:1580px;margin:14px auto 0;color:var(--muted);font-size:12px;text-align:center}@media(max-width:1120px){.workspace{grid-template-columns:220px minmax(400px,1fr)}.analysis{grid-column:1/-1;grid-template-columns:1.4fr 2fr 1fr}}@media(max-width:760px){main{padding:13px}.top{align-items:start;flex-direction:column}.actions{justify-content:flex-start}.workspace{display:flex;flex-direction:column}.panel,.map-stage{width:100%}.analysis{grid-template-columns:1fr}.tool-list:not(.route-list){grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main>
<header class="top"><div><p class="eyebrow">S2 전술 맵 제작 보조 도구</p><h1>S2 맵 메이커</h1></div><div class="actions"><label class="size-control">가로 <input id="widthInput" type="number" min="4" max="128" value="32"></label><label class="size-control">세로 <input id="heightInput" type="number" min="4" max="128" value="20"></label><button id="undo">실행 취소</button><button id="redo">다시 실행</button></div></header>
<section class="workspace"><aside class="panel"><div class="group"><div class="group-head"><h2>지형</h2></div><div class="tool-list" id="terrainTools"></div></div><div class="group"><div class="group-head"><h2>배치</h2><button class="add-route" id="addObject" title="배치 아이콘 추가">+</button></div><div class="object-tools" id="objectTools"></div><div class="object-editor"><p class="editor-title" id="objectEditorTitle">배치 아이콘을 선택하세요</p><label class="field">이름<input id="objectName" maxlength="24" disabled></label><label class="field">아이콘<input id="objectIcon" maxlength="2" disabled></label><label class="field">맵 문자<input id="objectMark" maxlength="2" disabled></label><label class="field">색상<input id="objectColor" type="color" disabled></label></div></div><div class="group"><div class="group-head"><h2>선택 경로</h2><button class="add-route" id="addRoute" title="경로 추가">+</button></div><div class="route-list" id="routeTools"></div><p class="hint">+ 버튼으로 경로를 추가합니다. 선택한 경로를 다시 칠하면 해당 칸이 지워집니다.</p></div><div class="group"><button class="tool" id="eraser"><span class="mark red">×</span>칸 지우기</button></div></aside>
<section class="map-stage"><div class="map-head"><div><span class="dot"></span><span id="mapSizeLabel">32 × 20</span></div><div><strong id="selected">벽·건물</strong> 선택됨</div></div><div class="canvas-wrap"><canvas id="map"></canvas></div><p class="help">가로·세로 숫자를 바꾸면 오른쪽과 아래쪽 크기가 즉시 변경됩니다 · 클릭·드래그로 배치</p></section><aside class="panel analysis"><div class="summary"><h2>경로 비교</h2><p>각 경로의 길이와 적 근접 위험 칸을 비교합니다.</p></div><div class="route-metrics" id="routeMetrics"></div><div class="count"><span>배치된 오브젝트</span><strong id="objectCount">0개</strong></div><div class="files"><button id="save">이름·경로 지정 저장</button><button id="load">맵 불러오기</button><button id="png">이미지 저장</button><button id="clear" class="danger">전체 지우기</button><input id="file" type="file" accept="application/json,.json" hidden></div></aside></section><footer id="notice">빈 32×20 맵입니다. 크기를 조절하거나 도구로 배치하세요.</footer></main>
<script>
(()=>{const MAX=128,MIN=4,COLORS=['#f45b5b','#18d7e8','#e7b567','#a879e8','#5ed08a','#ff8f4c','#df6fae','#7fa6ff','#72d6c9','#d98958','#b8d94e','#cf7cff'];const defaults=()=>[{id:'player',name:'플레이어',icon:'♟',mark:'P',color:'#18d7e8'},{id:'goal',name:'목표',icon:'◆',mark:'G',color:'#5ed08a'},{id:'enemy',name:'적',icon:'▲',mark:'E',color:'#f45b5b'},{id:'terminal',name:'해킹 단말',icon:'▣',mark:'H',color:'#e7b567'},{id:'door',name:'보안문',icon:'╫',mark:'D',color:'#d98958'},{id:'ally',name:'아군',icon:'●',mark:'A',color:'#72d6c9'},{id:'camera',name:'감시 장치',icon:'◉',mark:'C',color:'#a879e8'},{id:'item',name:'아이템',icon:'✦',mark:'I',color:'#b8d94e'},{id:'hazard',name:'위험 요소',icon:'!',mark:'!',color:'#ff8f4c'},{id:'waypoint',name:'표식',icon:'◇',mark:'W',color:'#7fa6ff'}];let W=32,H=20,C=W*H,map,defs=defaults(),tool={kind:'terrain',id:'wall'},past=[],next=[],painting=false,paintValue=true,last=-1,fileName='s2-map-maker';const $=s=>document.querySelector(s),canvas=$('#map'),ctx=canvas.getContext('2d'),wInput=$('#widthInput'),hInput=$('#heightInput'),sizeLabel=$('#mapSizeLabel'),selected=$('#selected'),notice=$('#notice'),terrainBox=$('#terrainTools'),objectBox=$('#objectTools'),routeBox=$('#routeTools'),metricBox=$('#routeMetrics'),nameInput=$('#objectName'),iconInput=$('#objectIcon'),markInput=$('#objectMark'),colorInput=$('#objectColor'),editorTitle=$('#objectEditorTitle');const terrains=[{id:'floor',name:'이동 가능',mark:'·'},{id:'wall',name:'벽·건물',mark:'■'},{id:'cover',name:'낮은 엄폐',mark:'▰'}];const index=(x,y)=>y*W+x,copy=m=>({terrain:[...m.terrain],objects:[...m.objects],routes:m.routes.map(r=>({...r,cells:[...r.cells]}))}),blank=()=>({terrain:Array(C).fill('floor'),objects:Array(C).fill(null),routes:[]}),capture=()=>({width:W,height:H,map:copy(map)}),clamp=v=>Math.max(MIN,Math.min(MAX,Math.round(Number(v)||32)));
function dimensions(w,h){W=w;H=h;C=W*H;wInput.value=W;hInput.value=H;sizeLabel.textContent=`${W} × ${H}`;const unit=960/Math.max(W,H);canvas.width=Math.round(W*unit);canvas.height=Math.round(H*unit)}function newRoute(n,cells=Array(C).fill(false)){return{id:`route-${Date.now()}-${n}`,name:`${n}번 경로`,color:COLORS[(n-1)%COLORS.length],cells}}
function resizeContent(newW,newH){const oldW=W,oldH=H,source=map;snapshot();dimensions(newW,newH);const resized=blank();resized.routes=source.routes.map(r=>({...r,cells:Array(C).fill(false)}));const keepW=Math.min(oldW,newW),keepH=Math.min(oldH,newH);for(let top=0;top<keepH;top++){const oldY=oldH-1-top,newY=newH-1-top;for(let x=0;x<keepW;x++){const oldIndex=oldY*oldW+x,newIndex=newY*newW+x;resized.terrain[newIndex]=source.terrain[oldIndex];resized.objects[newIndex]=source.objects[oldIndex];source.routes.forEach((r,i)=>resized.routes[i].cells[newIndex]=r.cells[oldIndex])}}map=resized;notice.textContent=`맵 크기를 ${W}×${H}로 변경했습니다.`;controls();draw()}
function snapshot(){past.push(capture());past=past.slice(-50);next=[]}function restore(state){dimensions(state.width,state.height);map=copy(state.map)}function route(){return map.routes.find(r=>r.id===tool.id)}function object(){return defs.find(o=>o.id===tool.id)}function select(kind,id,name){tool={kind,id};selected.textContent=name;controls()}function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function controls(){terrainBox.innerHTML=terrains.map(t=>`<button class="tool ${tool.kind==='terrain'&&tool.id===t.id?'active':''}" data-t="${t.id}"><span class="mark">${t.mark}</span>${t.name}</button>`).join('');terrainBox.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const d=terrains.find(v=>v.id===b.dataset.t);select('terrain',d.id,d.name)});objectBox.innerHTML=defs.map(o=>`<button class="object-tool ${tool.kind==='object'&&tool.id===o.id?'active':''}" data-o="${o.id}" title="${esc(o.name)}" aria-label="${esc(o.name)}" style="color:${o.color}">${esc(o.icon)}</button>`).join('');objectBox.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const d=defs.find(v=>v.id===b.dataset.o);select('object',d.id,d.name)});routeBox.innerHTML=map.routes.length?map.routes.map(r=>`<button class="route-button ${tool.kind==='route'&&tool.id===r.id?'active':''}" data-r="${r.id}"><span class="route-dot" style="background:${r.color}"></span>${esc(r.name)}</button>`).join(''):'<p class="hint">아직 경로가 없습니다.</p>';routeBox.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=map.routes.find(v=>v.id===b.dataset.r);select('route',r.id,r.name)});const o=object();[nameInput,iconInput,markInput,colorInput].forEach(input=>input.disabled=!o);editorTitle.textContent=o?`${o.icon} 선택 배치 설정`:'배치 아이콘을 선택하세요';nameInput.value=o?.name||'';iconInput.value=o?.icon||'';markInput.value=o?.mark||'';colorInput.value=o?.color||'#18d7e8';$('#eraser').classList.toggle('active',tool.kind==='eraser')}
function draw(){const cell=Math.min(canvas.width/W,canvas.height/H),tc={floor:'#14202a',wall:'#48505a',cover:'#c58d53'};ctx.clearRect(0,0,canvas.width,canvas.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=index(x,y),dy=H-1-y,px=x*cell,py=dy*cell;ctx.fillStyle=tc[map.terrain[i]]||tc.floor;ctx.fillRect(px,py,cell,cell);ctx.strokeStyle='#273642';ctx.lineWidth=Math.max(.5,Math.min(1,cell*.08));ctx.strokeRect(px,py,cell,cell);const active=map.routes.filter(r=>r.cells[i]);active.forEach((r,n)=>{ctx.beginPath();ctx.arc((x+.5)*cell+(n-(active.length-1)/2)*cell*.18,(dy+.5)*cell,Math.max(1,cell*.15),0,Math.PI*2);ctx.fillStyle=r.color;ctx.fill()});const o=defs.find(v=>v.id===map.objects[i]);if(o){const p=Math.max(.5,Math.min(2,cell*.12));ctx.fillStyle=o.color;ctx.fillRect(px+p,py+p,Math.max(1,cell-p*2),Math.max(1,cell-p*2));ctx.fillStyle='#fff';ctx.font=`700 ${Math.max(5,cell*.48)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.mark,(x+.5)*cell,(dy+.52)*cell)}}metrics();localStorage.setItem('s2-map-maker-state-v4',JSON.stringify({version:4,width:W,height:H,objectDefs:defs,map}));$('#undo').disabled=!past.length;$('#redo').disabled=!next.length}
function metrics(){const enemies=[];map.objects.forEach((id,i)=>{if(id==='enemy')enemies.push(i)});const danger=r=>r.cells.reduce((n,on,i)=>{if(!on)return n;const x=i%W,y=Math.floor(i/W);return n+(enemies.some(e=>Math.abs(x-e%W)+Math.abs(y-Math.floor(e/W))<=4)?1:0)},0);metricBox.innerHTML=map.routes.length?map.routes.map(r=>`<div class="route-card"><div class="route-card-title"><span style="background:${r.color}"></span><h3>${esc(r.name)}</h3></div><dl><dt>경로 칸</dt><dd>${r.cells.filter(Boolean).length}</dd><dt>적 근접 위험</dt><dd>${danger(r)}</dd></dl></div>`).join(''):'<p class="hint">+ 버튼으로 경로를 추가하면 비교 정보가 표시됩니다.</p>';$('#objectCount').textContent=`${map.objects.filter(Boolean).length}개`}
function pointer(e){const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),dy=Math.floor((e.clientY-r.top)/r.height*H),y=H-1-dy;return x<0||x>=W||y<0||y>=H?-1:index(x,y)}function apply(i,value=true){if(i<0||i===last)return;last=i;if(tool.kind==='route'){const r=route();if(r)r.cells[i]=value}else if(tool.kind==='eraser'){map.terrain[i]='floor';map.objects[i]=null;map.routes.forEach(r=>r.cells[i]=false)}else if(tool.kind==='terrain'){map.terrain[i]=tool.id;if(tool.id==='wall'){map.objects[i]=null;map.routes.forEach(r=>r.cells[i]=false)}}else if(tool.kind==='object')map.objects[i]=value?tool.id:null;draw()}
canvas.onpointerdown=e=>{const i=pointer(e);if(i<0)return;canvas.setPointerCapture(e.pointerId);snapshot();const r=route();paintValue=tool.kind==='route'&&r?!r.cells[i]:true;painting=true;last=-1;apply(i,paintValue)};canvas.onpointermove=e=>{if(painting)apply(pointer(e),paintValue)};canvas.onpointerup=canvas.onpointercancel=()=>{painting=false;last=-1};$('#addRoute').onclick=()=>{snapshot();const r=newRoute(map.routes.length+1);map.routes.push(r);select('route',r.id,r.name);notice.textContent=`${r.name}를 추가했습니다.`;draw()};$('#addObject').onclick=()=>{const number=defs.length+1,o={id:`custom-${Date.now()}`,name:`배치 ${number}`,icon:'●',mark:String(number).slice(-2),color:COLORS[(number-1)%COLORS.length]};defs.push(o);select('object',o.id,o.name);notice.textContent='새 배치 아이콘을 추가했습니다.';draw()};$('#eraser').onclick=()=>select('eraser','eraser','칸 지우기');nameInput.onchange=()=>{const o=object();if(!o)return;o.name=nameInput.value.trim()||'이름 없음';selected.textContent=o.name;controls();draw()};iconInput.onchange=()=>{const o=object();if(!o)return;o.icon=iconInput.value.trim().slice(0,2)||'●';controls();draw()};markInput.onchange=()=>{const o=object();if(!o)return;o.mark=markInput.value.trim().slice(0,2)||'·';controls();draw()};colorInput.oninput=()=>{const o=object();if(!o)return;o.color=colorInput.value;controls();draw()};
let resizeTimer;function requestResize(){const rawW=Number(wInput.value),rawH=Number(hInput.value);if(!Number.isFinite(rawW)||!Number.isFinite(rawH)||rawW<MIN||rawH<MIN||rawW>MAX||rawH>MAX)return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const w=clamp(rawW),h=clamp(rawH);if(w!==W||h!==H)resizeContent(w,h)},160)}wInput.oninput=requestResize;hInput.oninput=requestResize;$('#clear').onclick=()=>{if(!confirm('현재 맵의 모든 배치를 지울까요?'))return;snapshot();const routes=map.routes.map(r=>({...r,cells:Array(C).fill(false)}));map={...blank(),routes};draw()};$('#undo').onclick=()=>{if(!past.length)return;next.unshift(capture());restore(past.pop());if(tool.kind==='route'&&!route())tool={kind:'terrain',id:'wall'};controls();draw()};$('#redo').onclick=()=>{if(!next.length)return;past.push(capture());restore(next.shift());controls();draw()};
async function saveMapAs(){const blob=new Blob([JSON.stringify({version:4,width:W,height:H,objectDefs:defs,map},null,2)],{type:'application/json'}),suggestedName=`${fileName}.json`;if('showSaveFilePicker' in window){try{const handle=await window.showSaveFilePicker({suggestedName,types:[{description:'S2 맵 파일',accept:{'application/json':['.json']}}]});const writable=await handle.createWritable();await writable.write(blob);await writable.close();fileName=(handle.name||suggestedName).replace(/\.json$/i,'');notice.textContent=`${handle.name||suggestedName} 파일을 저장했습니다.`;return}catch(error){if(error?.name==='AbortError')return}}const requested=prompt('저장할 파일 이름을 입력하세요.',fileName);if(requested===null)return;fileName=(requested.trim().replace(/\.json$/i,'').replace(/[<>:"/\\|?*\x00-\x1F]/g,'_')||'s2-map-maker');download(blob,`${fileName}.json`)}$('#save').onclick=saveMapAs;$('#png').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`${fileName}.png`;a.click()};$('#load').onclick=()=>$('#file').click();$('#file').onchange=()=>{const input=$('#file'),f=input.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=normalize(JSON.parse(reader.result));dimensions(d.width,d.height);map=d.map;defs=d.defs;fileName=f.name.replace(/\.json$/i,'')||'s2-map-maker';past=[];next=[];select('terrain','wall','벽·건물');notice.textContent=`${W}×${H} 맵을 불러왔습니다.`;draw()}catch{notice.textContent='올바른 S2 맵 파일이 아닙니다.'}};reader.readAsText(f);input.value=''};
